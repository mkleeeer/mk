<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PDF 크롤러</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  .nav { margin-bottom: 16px; font-size: 0.9rem; }
  .nav a { color: #2563eb; text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }
  input[type=text] { flex: 1; padding: 10px 12px; font-size: 1rem; border: 1px solid #999; border-radius: 6px; }
  button { padding: 10px 16px; font-size: 0.95rem; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #aaa; cursor: not-allowed; }

  section.panel { border: 1px solid #ddd; border-radius: 10px; padding: 16px 18px; margin-bottom: 24px; }
  section.panel h2 { font-size: 1rem; margin: 0 0 12px; }
  #manualResult { margin-top: 10px; font-size: 0.88rem; }
  #manualResult .ok { color: #16a34a; }
  #manualResult .fail { color: #dc2626; }

  .pdf-table-wrap { max-height: 480px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; }
  table.pdf-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.pdf-table th, table.pdf-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #eee; vertical-align: top; }
  table.pdf-table th { position: sticky; top: 0; background: #f7f7f7; }
  table.pdf-table td.url-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.pdf-table a { color: #2563eb; }
  #pdfListMsg { color: #666; font-size: 0.85rem; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="nav"><a href="/">← 이미지 크롤러</a></div>
  <h1>PDF 크롤러</h1>

  <section class="panel">
    <h2>PDF URL 바로 다운로드</h2>
    <div class="row">
      <input type="text" id="manualUrl" placeholder="PDF 직접 링크">
      <input type="text" id="manualFolder" placeholder="폴더명(선택)" style="flex: 0 0 160px;">
      <button id="manualBtn">다운로드</button>
    </div>
    <p style="color:#666; font-size:0.9rem; margin-top:0;">
      PDF URL을 넣으면 그대로 다운로드합니다. 이미지 크롤러와 같은 다운로드 엔진을
      쓰고 있어서, 사이트가 막아둔 경우에도 서버가 대신 요청해서 가져옵니다.
    </p>
    <div id="manualResult"></div>
  </section>

  <section class="panel">
    <h2>받은 PDF 목록</h2>
    <div id="pdfListMsg">불러오는 중...</div>
    <div class="pdf-table-wrap">
      <table class="pdf-table">
        <thead>
          <tr><th>파일명</th><th>폴더</th><th>원본 URL</th><th>받은 시각</th></tr>
        </thead>
        <tbody id="pdfTableBody"></tbody>
      </table>
    </div>
  </section>

<script>
async function loadPdfList() {
  document.getElementById("pdfListMsg").textContent = "불러오는 중...";
  try {
    const res = await fetch("/api/pdfs/recent");
    const data = await res.json();
    const pdfs = data.pdfs || [];
    document.getElementById("pdfTableBody").innerHTML = pdfs.map(p => `
      <tr>
        <td>${p.filename}</td>
        <td>${p.job_id}</td>
        <td class="url-cell"><a href="${p.source_url}" target="_blank" title="${p.source_url}">${p.source_url}</a></td>
        <td>${p.created_at}</td>
      </tr>
    `).join("");
    document.getElementById("pdfListMsg").textContent = `${pdfs.length}개`;
  } catch (e) {
    document.getElementById("pdfListMsg").textContent = "불러오기 실패: " + e;
  }
}

document.getElementById("manualBtn").onclick = async () => {
  const url = document.getElementById("manualUrl").value.trim();
  const folder = document.getElementById("manualFolder").value.trim();
  const resultEl = document.getElementById("manualResult");
  if (!url) { resultEl.innerHTML = `<span class="fail">URL을 입력하세요.</span>`; return; }
  const btn = document.getElementById("manualBtn");
  btn.disabled = true;
  btn.textContent = "다운로드 중...";
  resultEl.textContent = "";
  try {
    const res = await fetch("/api/images/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, folder }),
    });
    const data = await res.json();
    if (data.success) {
      resultEl.innerHTML = `<span class="ok">완료: ${data.filename} (${data.job_id})</span>`;
      document.getElementById("manualUrl").value = "";
      loadPdfList();
    } else {
      resultEl.innerHTML = `<span class="fail">실패: ${data.error}</span>`;
    }
  } catch (e) {
    resultEl.innerHTML = `<span class="fail">요청 실패: ${e}</span>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "다운로드";
  }
};
document.getElementById("manualUrl").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("manualBtn").click();
});

loadPdfList();
</script>
</body>
</html>
